# .github/workflows/benchmarks.yml
# Dedicated benchmarking workflow for Zeta.
#
# Runs the compiler benchmarks that actually exist in this repository.
# The previous revision referenced `benches/`, `compiler_bench`,
# `runtime_bench` and `regression_test`, none of which exist, so every
# scheduled run failed with "could not find Cargo.toml" on the default
# branch (see issue #24).

name: Benchmarks

permissions:
  contents: read

on:
  # Run on push when compiler sources change
  push:
    branches: [ main, dev, bootstrap ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

  # Run on schedule (daily at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger from GitHub UI
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # SETUP JOB - Install the toolchain once for the benchmark job
  setup:
    runs-on: ubuntu-latest
    outputs:
      llvm_prefix: ${{ steps.set-llvm.outputs.llvm_prefix }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Check the Rust project is present
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ ! -f Cargo.toml ]; then
          echo "::error::Cargo.toml not found on ref ${REF_NAME}. The compiler crate lives on the bootstrap branch; adjust the workflow triggers (see issue #24)."
          exit 1
        fi
    - name: Install LLVM 21
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21
        sudo apt-get update
        sudo apt-get install -y llvm-21 llvm-21-dev llvm-21-tools libpolly-21-dev
    - name: Set LLVM prefix
      id: set-llvm
      run: |
        echo "LLVM_SYS_210_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
        echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-21" >> $GITHUB_ENV
        echo "llvm_prefix=/usr/lib/llvm-21" >> $GITHUB_OUTPUT
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
    - name: Cache cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-benchmarks

  # COMPILER BENCHMARKS - the only benchmark target that exists
  compiler-benchmarks:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Setup LLVM
      env:
        LLVM_PREFIX: ${{ needs.setup.outputs.llvm_prefix }}
      run: |
        echo "LLVM_SYS_210_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
        echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: nightly
    - name: Restore cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-benchmarks
    - name: Run compiler benchmarks
      run: |
        cargo run --release --bin performance_benchmark

  # BENCHMARK REPORT - summary line for the run
  benchmark-report:
    runs-on: ubuntu-latest
    needs: [compiler-benchmarks]
    if: always()
    steps:
    - name: Generate benchmark report
      env:
        BENCH_RESULT: ${{ needs.compiler-benchmarks.result }}
        TRIGGER: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        echo "ZETA BENCHMARK REPORT"
        echo "====================="
        echo "compiler benchmarks: ${BENCH_RESULT}"
        echo "trigger: ${TRIGGER}"
        echo "ref: ${REF_NAME}"
