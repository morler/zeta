# CI for Zeta — runs on self-hosted Galaxy runner
name: CI
on:
  push:
    branches: [ main, dev, bootstrap ]
  pull_request:
    branches: [ main, dev, bootstrap ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

jobs:
  check:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Check
      run: cargo check --workspace --all-targets
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Fmt
      run: cargo fmt --all -- --check

  test:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: check
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Test
      run: cargo test --workspace
    - name: Build release
      run: cargo build --release

  zeta-selfhost:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Build release compiler
      run: |
        cargo build --release
        echo "zetac built successfully"
    - name: Compile all zeta_src/ files
      run: |
        # Recurse: the top-level glob only matched 5 of 51 files (issue #23).
        #
        # 11 files are known to fail because they still contain Rust source
        # rather than Zeta (see issues #23 and #26). They are listed in
        # .github/zeta-src-known-failures.txt so regressions in the other 40 are caught
        # without turning the build permanently red. Remove entries from that
        # file as each one is rewritten.
        KNOWN_FILE=.github/zeta-src-known-failures.txt
        FAILED=0
        COUNT=0
        UNEXPECTED=0
        while IFS= read -r zfile; do
          COUNT=$((COUNT + 1))
          if ./target/release/zetac "$zfile" >/dev/null 2>&1; then
            if grep -qxF "$zfile" "$KNOWN_FILE" 2>/dev/null; then
              echo "  FIXED $zfile (remove from $KNOWN_FILE)"
            else
              echo "  OK    $zfile"
            fi
          else
            if grep -qxF "$zfile" "$KNOWN_FILE" 2>/dev/null; then
              echo "  KNOWN $zfile"
            else
              echo "  FAIL  $zfile"
              UNEXPECTED=$((UNEXPECTED + 1))
            fi
            FAILED=$((FAILED + 1))
          fi
        done < <(find zeta_src -name '*.z' | sort)
        echo "checked $COUNT file(s): $FAILED failing, $UNEXPECTED unexpected"
        if [ "$COUNT" -eq 0 ]; then
          echo "::error::no zeta_src files found"
          exit 1
        fi
        if [ "$UNEXPECTED" -gt 0 ]; then
          echo "::error::$UNEXPECTED file(s) newly fail to compile; see #23"
          exit 1
        fi
    - name: Run JIT smoke test
      run: |
        # tests/*.z at the repo root never existed, so the previous step was dead
        # code (issue #23). Use an inline program instead.
        cat > /tmp/jit_smoke.z <<'ZETA'
        fn main() -> i64 {
            println_i64(42);
            return 0;
        }
        ZETA
        OUT=$(./target/release/zetac --jit /tmp/jit_smoke.z 2>&1)
        echo "$OUT"
        echo "$OUT" | grep -q '42' || { echo "::error::JIT smoke test did not print 42"; exit 1; }

  benchmark:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    needs: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Build release
      run: cargo build --release
    - name: Run benchmarks
      run: |
        echo "=== Zeta Compiler Performance ==="
        hyperfine --warmup 2 --runs 5 'cargo build --release 2>&1' 2>/dev/null || \
          echo "hyperfine not available - skipping"
        echo "=== Self-host compilation ==="
        time ./target/release/zetac ./zeta_src/main.z 2>&1
