# Build & Release — compiles zetac binary and publishes GitHub Release
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use latest commit)'
        required: false
        type: string

permissions:
  contents: write  # required to publish the GitHub Release

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
  LLVM_SYS_211_PREFIX: /usr/lib/llvm-21

jobs:
  build-linux:
    runs-on: [self-hosted, galaxy, wsl2, x86-64]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Build zetac (release)
      run: |
        cargo build --release --bin zetac
        echo "Binary size:"
        ls -lh target/release/zetac

    - name: Build zetac (JIT variant)
      run: |
        cp target/release/zetac target/release/zetac-linux-x86_64
        # Quick sanity check
        ./target/release/zetac --version 2>&1 || ./target/release/zetac --help 2>&1 | head -3 || true

    - name: Create release archive
      run: |
        mkdir -p dist
        cp target/release/zetac dist/zetac-linux-x86_64
        # Include runtime object for AOT compilation
        cp zeta_runtime_c.o dist/ 2>/dev/null || cp target/release/zeta_runtime_c.o dist/ 2>/dev/null || echo "No runtime .o to include"
        # Create checksum
        sha256sum dist/zetac-linux-x86_64 > dist/zetac-linux-x86_64.sha256
        echo "Release artifacts:"
        ls -la dist/

    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        # On a tag push use that tag; on manual dispatch prefer inputs.tag,
        # falling back to the commit SHA so the release name is still unique.
        TAG="${GITHUB_REF_NAME}"
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="build-${GITHUB_SHA::12}"
          fi
        fi

        echo "Publishing release $TAG"
        gh release create "$TAG" \
          --generate-notes \
          --latest \
          dist/zetac-linux-x86_64 \
          dist/zetac-linux-x86_64.sha256
